version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform"
      - curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.6/terraform_1.16.6_linux_amd64.zip
      - unzip -o terraform.zip
      - install terraform /usr/local/bin/terraform
      - terraform --version
    
  pre_build:
    commands:
      - cp "$CODEBUILD_SRC_DIR_BuildArtifact/tfplan"
      - cp "$CODEBUILD_SRC_DIR_BuildArtifact/ .terraform.lock.hcl" ./.terraform.lock.hcl
      - echo "Initializing Terraform"
      - terraform init -input=false -lockfile=readonly
  
  build:
    commands:
      - echo "Applying Terraform configuration"
      - test -f tfplan
      - terraform apply -input=false tfplan
  
  post_build:
    commands:
      - echo "Terraform apply completed successfully"